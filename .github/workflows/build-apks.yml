name: Build RSOUNDS Debug APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'appthemehelper/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/build-apks.yml'

permissions:
  contents: read

concurrency:
  group: build-rsounds-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Normal and F-Droid APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleNormalDebug :app:assembleFdroidDebug

      - name: Upload Normal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rsounds-normal-debug
          path: app/build/outputs/apk/normal/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload F-Droid debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rsounds-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 14
