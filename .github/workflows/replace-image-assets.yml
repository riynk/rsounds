name: Replace screenshots and notification preview assets

on:
  push:
    branches: [main]
    paths:
      - "Screenshot tampilan aplikasi.zip"
      - ".github/workflows/replace-image-assets.yml"

permissions:
  contents: write

jobs:
  replace-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replace existing JPG screenshots, then generate WEBP assets
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image
          import io

          archive = Path("Screenshot tampilan aplikasi.zip")
          webp_names = {
              "Plain Atmosphere": "np_minimalistic_circle.webp",
              "Tiny": "np_tiny.webp",
              "Simple": "np_simple.webp",
              "Plain": "np_plain.webp",
              "Peek": "np_peek.webp",
              "Normal": "np_normal.webp",
              "MD3": "np_md3.webp",
              "Material": "np_material.webp",
              "Gradient": "np_gradient.webp",
              "Full": "np_full.webp",
              "Flat": "np_flat.webp",
              "Fit": "np_fit.webp",
              "Color": "np_color.webp",
              "Classic": "np_classic.webp",
              "Circle": "np_circle.webp",
              "Card": "np_card.webp",
              "Blur Card": "np_blur_card.webp",
              "blur": "np_blur.webp",
              "adaptive": "np_adaptive.webp",
          }
          screenshot_targets = {
              "adaptive": "screenshots/adaptive.jpg",
              "blur": "screenshots/blur.jpg",
              "classic": "screenshots/classic.jpg",
              "color": "screenshots/color.jpg",
              "fit": "screenshots/fit.jpg",
              "flat": "screenshots/flat.jpg",
              "material": "screenshots/material.jpg",
              "peek": "screenshots/peek.jpg",
              "tiny": "screenshots/tiny.jpg",
          }

          # Extract all source JPGs first, preserving the original bytes.
          extracted = {}
          with ZipFile(archive) as zf:
              for member in zf.namelist():
                  p = Path(member)
                  if p.suffix.lower() in (".jpg", ".jpeg") and p.stem.strip() in webp_names:
                      extracted[p.stem.strip()] = zf.read(member)

          if len(extracted) != 19:
              raise SystemExit(f"Expected 19 source JPGs, found {len(extracted)}")

          # Step 1: replace the existing matching JPG files in the repository.
          replaced_jpg = 0
          for stem, target in screenshot_targets.items():
              if stem.lower() in {name.lower() for name in extracted}:
                  target_path = Path(target)
                  if not target_path.is_file():
                      raise SystemExit(f"Expected existing JPG target is missing: {target}")
                  source_stem = next(name for name in extracted if name.lower() == stem.lower())
                  target_path.write_bytes(extracted[source_stem])
                  replaced_jpg += 1

          # Step 2: generate all WEBP assets from those extracted JPG sources.
          out = Path("app/src/main/res/drawable-xxxhdpi")
          for stem, filename in webp_names.items():
              with Image.open(io.BytesIO(extracted[stem])) as im:
                  im.convert("RGB").save(out / filename, "WEBP", quality=90, method=6)

          print(f"Replaced {replaced_jpg} existing JPG screenshots first, then generated {len(webp_names)} WEBP assets.")
          PY
      - name: Commit replacements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-xxxhdpi/np_*.webp screenshots/*.jpg
          if git diff --cached --quiet; then
            echo "JPG and WEBP assets already match the ZIP sources."
            exit 0
          fi
          git commit -m "Update JPG screenshots then regenerate WEBP assets"
          git push origin main
